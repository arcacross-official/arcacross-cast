<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121528"><title>アルカクロス | キャスト一覧</title><style>:root{font-family:system-ui,sans-serif;color:#f5e9cb;background:#111527}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#303454,#111527 65%);min-height:100vh}header{text-align:center;padding:26px 12px;border-bottom:1px solid #9c8150}h1{font-family:serif;letter-spacing:.12em;margin:5px}p{line-height:1.6}.sub{color:#c9b58a}.wrap{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:15px}.card,.panel{background:#20243b;border:1px solid #9e8251;border-radius:12px;padding:12px}.card{cursor:pointer;text-align:center}.card img{width:100%;height:185px;object-fit:cover;border-radius:8px;background:#353954}.card strong{display:block;margin-top:8px}button,input,textarea{font:inherit}button{border:1px solid #d9bd7d;background:#51402c;color:#fff2d2;border-radius:9px;padding:11px 16px;cursor:pointer;margin:4px}button.secondary{background:#252b43}button:disabled{opacity:.45;cursor:not-allowed}.card.picked{border:3px solid #eac979;box-shadow:0 0 0 2px #7b5c27 inset}.card.picked:after{content:"✓ 選択中";display:block;color:#f6d786;margin-top:5px}input,textarea{background:#11172b;color:white;border:1px solid #8e805f;border-radius:6px;padding:10px;width:100%;margin:5px 0 12px}textarea{min-height:70px}.hidden{display:none!important}.center{text-align:center}.detail{max-width:530px;margin:auto}.portrait{max-width:280px;width:100%;height:320px;object-fit:cover;border-radius:10px;background:#353954}.status{color:#dfc58b;font-size:13px}footer{text-align:center;padding:28px;color:#aa9c7e}label{display:block;margin-top:8px}.entry{display:flex;gap:12px;align-items:center;border-bottom:1px solid #61553f;padding:10px 0}.entry img{width:60px;height:70px;object-fit:cover}.entry>div{flex:1}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:13px;color:#c9b58a}.selected-panel{margin-top:25px;padding:18px;background:#1b2036;border:1px solid #b89b62;border-radius:14px}.selected-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.selected-item{position:relative;text-align:center;background:#292d45;border:1px solid #b89b62;border-radius:10px;padding:9px;min-width:0}.selected-item img{width:100%;height:125px;object-fit:cover;border-radius:7px}.selected-item strong{display:block;margin-top:6px;overflow-wrap:anywhere}.selected-item .remove{position:absolute;right:2px;top:2px;border-radius:50%;width:30px;height:30px;padding:0;margin:0;background:#6a3040;font-weight:bold}.slot{border:1px dashed #756a59;border-radius:10px;min-height:175px;display:flex;align-items:center;justify-content:center;color:#a99a7e;text-align:center;font-size:13px}@media(max-width:420px){.selected-grid{gap:6px}.selected-item{padding:5px}.selected-item img{height:95px}.slot{min-height:145px}}</style></head><body><header><div class="sub">ARCACROSS · GUILD ARCHIVE</div><h1>キャスト一覧</h1><div class="sub">共に時を過ごす仲間をお選びください</div></header><main class="wrap"><section id="list"><div class="topbar"><h2>キャスト一覧</h2><span id="pickCount" class="small">選択中：0 / 3人</span><button class="secondary" onclick="openAdmin()">管理</button></div><div id="cards" class="grid"></div><p class="center sub" id="empty"></p><div class="selected-panel"><div class="topbar"><h3>選択中のキャスト</h3><span id="selectedCount" class="small">0 / 3人</span></div><div id="selectedPreview" class="selected-grid"></div><p class="small center">選択を取り消す場合は写真右上の × を押してください</p><div class="center"><button id="finishBtn" onclick="finishSelection()" disabled>選択したキャストを確認（0 / 3）</button></div></div></section><section id="detail" class="hidden detail panel center"><button class="secondary" onclick="show('list')">← 一覧へ</button><div><img id="detailImg" class="portrait" alt="キャスト写真"></div><h2 id="detailName"></h2><p id="detailHobby"></p><p id="detailIntro"></p><button onclick="confirmPick()">このキャストを選択 / 解除</button></section><section id="done" class="hidden detail panel center"><h2>選択したキャスト</h2><p>この画面をスタッフにお見せください</p><div id="doneCards" class="grid"></div><button onclick="resetPick()">最初の画面に戻る</button></section><section id="admin" class="hidden"><div class="topbar"><h2>ギルド管理画面</h2><button class="secondary" onclick="show('list')">お客様画面へ</button></div><div class="panel"><p class="small">この試作版の編集内容は、この端末のブラウザにのみ保存されます。別端末への同期や本番用の認証は未実装です。</p><label>キャスト名<input id="name" maxlength="40"></label><label>趣味<input id="hobby" maxlength="100"></label><label>自己紹介<textarea id="intro" maxlength="500"></textarea></label><label>宣材写真<input id="photo" type="file" accept="image/*"></label><label><input id="active" type="checkbox" checked style="width:auto"> お客様画面に表示する</label><button onclick="saveMember()">保存する</button><button class="secondary" onclick="clearForm()">入力をクリア</button><div id="entries"></div></div></section></main><footer>ARCACROSS · Cast Selection</footer><script>const KEY='arcacross_casts_v1';let members=[],editing=null,selected=null,picks=[];const $=id=>document.getElementById(id);const placeholder='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="100%" height="100%" fill="#353954"/><text x="50%" y="50%" text-anchor="middle" fill="#c9b58a" font-size="24">NO PHOTO</text></svg>');try{members=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){members=[]}function persist(){try{localStorage.setItem(KEY,JSON.stringify(members));return true}catch(e){alert('保存できませんでした。画像サイズや端末の保存容量を確認してください。');return false}}function show(id){['list','detail','done','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='list')render();if(id==='admin')renderAdmin();window.scrollTo(0,0)}function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}function render(){const box=$('cards');box.replaceChildren();members.filter(m=>m.active).forEach(m=>{const c=node('div');c.className='card';if(picks.includes(m.id))c.classList.add('picked');const img=node('img');img.src=m.photo||placeholder;img.alt=m.name;const title=node('strong',m.name);c.append(img,title);c.onclick=()=>openDetail(m.id);box.append(c)});renderSelectedPreview();$('pickCount').textContent='選択中：'+picks.length+' / 3人';$('finishBtn').textContent='選択したキャストを確認（'+picks.length+' / 3）';$('finishBtn').disabled=picks.length===0;$('empty').textContent=box.children.length?'':'現在ご案内できるキャストはいません。'}function renderSelectedPreview(){const box=$('selectedPreview');box.replaceChildren();$('selectedCount').textContent=picks.length+' / 3人';for(let i=0;i<3;i++){const m=members.find(x=>x.id===picks[i]);if(!m){const slot=node('div',(i+1)+'人目 未選択');slot.className='slot';box.append(slot);continue}const c=node('div');c.className='selected-item';const img=node('img');img.src=m.photo||placeholder;img.alt=m.name;const name=node('strong',m.name);const remove=node('button','×');remove.className='remove';remove.setAttribute('aria-label',m.name+'の選択を解除');remove.onclick=()=>{picks=picks.filter(id=>id!==m.id);render()};c.append(img,name,remove);box.append(c)}}function openDetail(id){selected=members.find(m=>m.id===id);if(!selected)return;$('detailImg').src=selected.photo||placeholder;$('detailName').textContent=selected.name;$('detailHobby').textContent=selected.hobby?'趣味：'+selected.hobby:'';$('detailIntro').textContent=selected.intro||'';show('detail')}function confirmPick(){if(!selected)return;const i=picks.indexOf(selected.id);if(i>=0){picks.splice(i,1)}else{if(picks.length>=3){alert('選べるキャストは3人までです。変更する場合は選択済みのキャストを解除してください。');return}picks.push(selected.id)}show('list')}function finishSelection(){if(!picks.length)return;const box=$('doneCards');box.replaceChildren();picks.forEach((id,i)=>{const m=members.find(x=>x.id===id);if(!m)return;const c=node('div');c.className='card';const img=node('img');img.src=m.photo||placeholder;img.alt=m.name;c.append(img,node('strong',(i+1)+'人目：'+m.name));box.append(c)});show('done')}function resetPick(){selected=null;picks=[];show('list')}function openAdmin(){const pin=prompt('管理用PINを入力（試作版：1234）');if(pin==='1234')show('admin');else if(pin!==null)alert('PINが違います')}function clearForm(){editing=null;['name','hobby','intro','photo'].forEach(x=>$(x).value='');$('active').checked=true}function saveMember(){const name=$('name').value.trim();if(!name){alert('名前を入力してください');return}const old=members.find(m=>m.id===editing);const file=$('photo').files[0];if(file&&file.size>2*1024*1024){alert('写真は2MB以下にしてください');return}const finish=photo=>{const m={id:editing||String(Date.now())+Math.random(),name,hobby:$('hobby').value.trim(),intro:$('intro').value.trim(),active:$('active').checked,photo};const next=members.filter(x=>x.id!==editing).concat(m);const prev=members;members=next;if(!persist())members=prev;else{clearForm();renderAdmin()}};if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish(old?.photo||'')}function renderAdmin(){const box=$('entries');box.replaceChildren();members.forEach(m=>{const row=node('div');row.className='entry';const img=node('img');img.src=m.photo||placeholder;const info=node('div');info.append(node('strong',m.name),node('div',m.active?'表示中':'非表示'));const edit=node('button','編集');edit.onclick=()=>{editing=m.id;$('name').value=m.name;$('hobby').value=m.hobby;$('intro').value=m.intro;$('active').checked=m.active;$('photo').value='';window.scrollTo(0,0)};const del=node('button','削除');del.className='secondary';del.onclick=()=>{if(confirm(m.name+'を削除しますか？')){members=members.filter(x=>x.id!==m.id);persist();renderAdmin()}};row.append(img,info,edit,del);box.append(row)})}render();</script></body></html>
