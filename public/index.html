/* Cast enhancements */
.card{position:relative;overflow:visible}.frame-normal{--frame:#b9a888;border:2px solid var(--frame)}.frame-double{--frame:#b9a888;border:4px double var(--frame)}.frame-corner{--frame:#b9a888;border:2px solid var(--frame);box-shadow:inset 0 0 0 3px #20243b,inset 0 0 0 4px var(--frame)}.frame-elegant{--frame:#b9a888;border:2px solid var(--frame);box-shadow:0 0 0 1px var(--frame),0 4px 18px #0005}.frame-elegant:before,.frame-corner:before{content:'✦';position:absolute;right:7px;bottom:5px;color:var(--frame);font-size:13px;pointer-events:none}.card.picked{outline:2px solid #eac979;outline-offset:2px}.cast-badges{position:absolute;top:-9px;left:-7px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;z-index:2;pointer-events:none}.cast-badge{font-size:10px;font-weight:800;letter-spacing:.03em;background:#d8bd7b;color:#272334;padding:4px 7px;border-radius:5px;box-shadow:0 2px 6px #0008}.cast-badge.hot{background:#d96c67;color:white}.cast-badge.new{background:#f0d68b}.cast-badge.birthday{background:#e3a4c4;color:#33233b}.selected-panel.top-selection{margin:0 0 22px;padding:12px}.top-selection .selected-item img{height:85px}.top-selection .slot{min-height:120px}.top-selection .selected-item{padding:5px}.top-selection .selected-item strong{font-size:12px}.top-selection .selected-grid{gap:7px}.bio-box{text-align:left;margin:18px auto;border:1px solid #aa9265;border-radius:10px;padding:14px;background:#171c31}.bio-box h3{font-size:14px;color:#e6cb93;margin:0 0 9px;letter-spacing:.08em}.bio-box p{white-space:pre-wrap;margin:0;color:#f3e8d2}.profile-fields{text-align:left;max-width:320px;margin:14px auto}.profile-fields p{margin:6px 0}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gallery-grid img{width:100%;height:115px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid #a28a5c}.gallery-manage{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.gallery-manage div{position:relative}.gallery-manage img{width:82px;hei /* Rich frame choices: elegant embellishments without covering cast faces */
.frame-royal,.frame-floral,.frame-celestial,.frame-lace{position:relative;border:3px solid var(--frame);isolation:isolate}
.frame-royal{box-shadow:inset 0 0 0 3px #20243b,inset 0 0 0 5px var(--frame),0 5px 18px #0006;border-radius:13px}
.frame-royal::before{content:'❖';position:absolute;top:-15px;left:50%;transform:translateX(-50%);padding:0 9px;background:#20243b;color:var(--frame);font-size:22px;z-index:1}
.frame-royal::after{content:'❖';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);padding:0 9px;background:#20243b;color:var(--frame);font-size:20px}
.frame-floral{border-radius:16px 5px 16px 5px;box-shadow:inset 0 0 0 2px #20243b,inset 0 0 0 3px var(--frame)}
.frame-floral::before{content:'❀';position:absolute;top:-15px;right:-10px;color:var(--frame);font-size:29px;text-shadow:0 1px 4px #111527;background:#20243b;border-radius:50%;line-height:1}
.frame-floral::after{content:'❀';position:absolute;bottom:-15px;left:-10px;color:var(--frame);font-size:29px;text-shadow:0 1px 4px #111527;background:#20243b;border-radius:50%;line-height:1}
.frame-celestial{border-radius:13px;box-shadow:0 0 0 2px #20243b,0 0 0 3px var(--frame),0 0 15px color-mix(in srgb,var(--frame),transparent 65%)}
.frame-celestial::before{content:'☾ ✧';position:absolute;top:-15px;right:7px;color:var(--frame);font-size:22px;line-height:1;background:#20243b;padding:0 5px}
.frame-celestial::after{content:'✦ ✧ ✦';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);color:var(--frame);font-size:14px;letter-spacing:3px;background:#20243b;padding:0 7px;white-space:nowrap}
.frame-lace{border-radius:15px;border:3px double var(--frame);outline:1px dotted var(--frame);outline-offset:3px;box-shadow:inset 0 0 0 3px #20243b,inset 0 0 0 4px var(--frame)}
.frame-lace::before{content:'✧';position:absolute;top:-13px;right:-8px;font-size:23px;color:var(--frame);background:#20243b;line-height:1}
.frame-lace::after{content:'✧';position:absolute;bottom:-13px;left:-8px;font-size:23px;color:var(--frame);background:#20243b;line-height:1}

<header><div class="sub">ARCACROSS · GUILD ARCHIVE</div><h1>キャスト一覧</h1><div class="sub">異世界の仲間たちをご紹介します</div></header>

</section>
<section id="detail" class="hidden detail panel center"><button class="secondary" id="backBtn">← 一覧へ</button><div><img id="detailImg" class="portrait" alt="キャスト写真"></div><h2 id="detailName"></h2><p id="detailHobby"></p><div id="detailFields" class="profile-fields"></div><div id="detailSocial" class="social-links"></div><div class="bio-box"><p id="detailIntro"></p></div><div id="gallerySection" class="bio-box hidden"><h3>PHOTO GALLERY</h3><div id="detailGallery" class="gallery-grid"></div></div></section>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getFirestore,collection,onSnapshot} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyBOqWP2_wwVUkCXZH5eoGzRL0mFgSLLGPE',authDomain:'arcacross-cast.firebaseapp.com',projectId:'arcacross-cast',storageBucket:'arcacross-cast.firebasestorage.app',messagingSenderId:'39349991153',appId:'1:39349991153:web:c21e678558415530075b50'});
const db=getFirestore(app);
let members=[],selected=null,loaded=false;
const $=id=>document.getElementById(id);
const placeholder='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="100%" height="100%" fill="#353954"/><text x="50%" y="50%" text-anchor="middle" fill="#c9b58a" font-size="24">NO PHOTO</text></svg>');

function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function frameClass(m){return 'frame-'+(['normal','double','corner','elegant','royal','floral','celestial','lace'].includes(m.frameStyle)?m.frameStyle:'normal')}
function birthdayMonth(m){if(!m.birthday)return false;const n=Number(String(m.birthday).split('-')[0]);return n===Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',month:'numeric'}).format(new Date()))}
function addBadges(card,m){const labels=[];if(m.castMark==='pickup')labels.push(['✦ PICK UP!','pickup']);if(m.castMark==='new')labels.push(['🐣 NEW','new']);if(m.castMark==='hot')labels.push(['🔥 HOT!','hot']);if(birthdayMonth(m))labels.push(['🎂 BIRTHDAY','birthday']);if(!labels.length)return;const wrap=node('div');wrap.className='cast-badges';for(const [label,type] of labels){const b=node('span',label);b.className='cast-badge '+type;wrap.append(b)}card.append(wrap)}
function styleCard(c,m){c.classList.add(frameClass(m));c.style.setProperty('--frame',/^#[0-9a-f]{6}$/i.test(m.frameColor||'')?m.frameColor:'#b9a888');addBadges(c,m)}
function displayPriority(m){return m.pinnedRole?0:m.onDuty?1:2}
function sortedVisibleMembers(){return members.filter(m=>m.active).sort((a,b)=>displayPriority(a)-displayPriority(b)||(a.order??0)-(b.order??0))}
function addDutyBadge(card,m){if(!m.onDuty)return;const badge=node('span','● 本日出勤');badge.className='duty-badge';card.append(badge)}

function createCastCard(m){const c=node('div');c.className='card';styleCard(c,m);const img=node('img');img.src=m.photo||placeholder;img.alt=m.name;img.loading='lazy';const title=node('strong',m.name);const hint=node('span','プロフィールを見る ›');hint.className='profile-link-hint';c.append(img,title,hint);c.setAttribute('role','button');c.setAttribute('tabindex','0');c.setAttribute('aria-label',m.name+'のプロフィールを見る');c.onclick=()=>openDetail(m.id);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(m.id)}};return c}
function render(){const box=$('cards');box.replaceChildren();const order=(a,b)=>Number(!!b.pinnedRole)-Number(!!a.pinnedRole)||(a.order??0)-(b.order??0);const all=members.filter(m=>m.active).sort(order);all.forEach(m=>box.append(createCastCard(m)));$('empty').textContent=all.length?'':'現在公開中のキャストはいません。'}
function showDetail(){$('list').classList.add('hidden');$('detail').classList.remove('hidden');window.scrollTo(0,0)}
function showList(){$('detail').classList.add('hidden');$('list').classList.remove('hidden');window.scrollTo(0,0)}
function showPhoto(src){$('modalImg').src=src;$('photoModal').classList.remove('hidden')}

function socialUrl(kind,id){const handle=String(id||'').trim().replace(/^@+/,'');if(!handle)return '';if(!/^[A-Za-z0-9._]+$/.test(handle))return '';const base={instagram:'https://www.instagram.com/',tiktok:'https://www.tiktok.com/@',twitter:'https://x.com/'}[kind];return base?base+encodeURIComponent(handle)+(kind==='instagram'?'/':''):''}
function renderSocialLinks(target,m){const box=$(target);box.replaceChildren();for(const [label,key,kind,legacy] of [['Instagram','instagramId','instagram','instagramUrl'],['TikTok','tiktokId','tiktok','tiktokUrl'],['X (Twitter)','twitterId','twitter','twitterUrl']]){const id=String(m[key]||'').trim();let url=socialUrl(kind,id);if(!url&&!id&&m[legacy]){try{const parsed=new URL(m[legacy]);if(parsed.protocol==='https:'&&((kind==='instagram'&&['instagram.com','www.instagram.com'].includes(parsed.hostname))||(kind==='tiktok'&&['tiktok.com','www.tiktok.com'].includes(parsed.hostname))||(kind==='twitter'&&['x.com','www.x.com','twitter.com','www.twitter.com'].includes(parsed.hostname))))url=parsed.href}catch(e){}}if(!url)continue;const a=node('a');a.className='social-link';a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label+' · '+(id?(id.startsWith('@')?id:'@'+id):'プロフィール')+' ↗';box.append(a)}}

function openDetail(id){selected=members.find(m=>m.id===id);if(!selected)return;$('detailImg').src=selected.photo||placeholder;$('detailName').textContent=selected.name;$('detailHobby').textContent=selected.hobby?'趣味：'+selected.hobby:'';$('detailIntro').textContent=selected.intro||'自己紹介は準備中です。';const fields=$('detailFields');fields.replaceChildren();for(const [label,value] of [['出身地',selected.hometown],['誕生日',selected.birthday?formatBirthday(selected.birthday):''],['キャラ',selected.character]]){if(value)fields.append(node('p',label+'：'+value))}renderSocialLinks('detailSocial',selected);const gal=$('detailGallery');gal.replaceChildren();const photos=Array.isArray(selected.gallery)?selected.gallery:[];$('gallerySection').classList.toggle('hidden',photos.length===0);photos.forEach(src=>{const img=node('img');img.src=src;img.alt=selected.name+'の追加写真';img.onclick=()=>showPhoto(src);gal.append(img)});showDetail()}
function formatBirthday(s){const [m,d]=String(s).split('-');return Number(m)+'月'+Number(d)+'日'}

$('backBtn').onclick=showList;
$('photoModal').onclick=()=> $('photoModal').classList.add('hidden');
onSnapshot(collection(db,'casts'),snapshot=>{members=snapshot.docs.map(d=>({id:d.id,...d.data()}));loaded=true;render()},e=>{console.error(e);$('empty').textContent='読み込みに失敗しました。管理者にお問い合わせください。'});
</script></body></html>
